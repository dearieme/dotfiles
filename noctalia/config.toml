[accessibility]
ui_scale = 1.2000000104308128

[bar.default]
background_opacity = 0.71999998390674591
capsule = true
center = [ "media" ]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "clock",
    "session"
]
font_family = "Adwaita Sans"
font_scale = 1.0999999828636646
icon_color = "primary"
padding = 4
start = [ "launcher", "wallpaper", "workspaces", "active_window" ]
thickness = 36

[location]
address = "Aylesbury, UK"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1920.0
    cy = 1978.0
    output = "HDMI-A-1"
    placement_height = 2160.0
    placement_width = 3840.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 957.3333740234375
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
corner_radius_scale = 1.2000000178813934
font_family = "Adwaita Sans"

    [shell.screen_corners]
    size = 28

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

[wallpaper.default]
path = "/home/scott/Pictures/runival_sky_cwt.jpg"

[wallpaper.last]
path = "/home/scott/Pictures/runival_sky_cwt.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/scott/Pictures/runival_sky_cwt.jpg"

[widget.active_window]
max_length = 420

[widget.clock]
color = "primary"
font_scale = 1.1000000000000001
scale = 1.1000000000000001
tooltip_format = "%Y-%m-%d %H:%M:%S"

[widget.media]
art_size = 32
max_length = 420
